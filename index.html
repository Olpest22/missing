/* Layout: the wall is a tall block; each poster is its own small picture that the browser places and scrolls; a lightbox shows one poster up close */
:root{
  --wall:#1b1815;
  --ink:#1c1817;
  --red:#b3161c;
  --paper:#f3f1ec;
  --rule:#c9c4ba;
  --muted:#6b645c;
  --pen:#23408e;
  --narrow:"PT Sans Narrow","Arial Narrow",Arial,sans-serif;
  --hand:Caveat,"Segoe Print",cursive;
  color-scheme:dark;
}
html,body{overflow-x:hidden}
[hidden]{display:none!important}
body{background:var(--wall);color:var(--ink)}
#wall{position:relative;z-index:0;contain:layout paint;overflow:hidden;height:900vh;background-color:var(--wall);outline:none}
#wall:focus-visible{box-shadow:inset 0 0 0 3px #f2c14e}
.pst{position:absolute;left:0;top:0;display:block;pointer-events:none}
.dusk{position:fixed;inset:0;pointer-events:none;z-index:3;will-change:opacity;background:radial-gradient(ellipse at 50% 45%,transparent 28%,rgba(5,3,2,.92) 100%);opacity:.25}
.lb{position:fixed;inset:0;z-index:5;background:rgba(8,6,5,.86);display:grid;place-items:center;padding:16px;cursor:zoom-out;outline:none}
.lb canvas{display:block;transform:rotate(-1.2deg);max-width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

</style>

    if (!wFirst) wFirst = performance.now();
    asked.set(ck, 1);
    workers[faceNext++ % nf].postMessage({ t: 'face', id: ck, look: look, key: key, scale: scale });
    return false;
  }
  // a poster drawn here is handed to a worker to become a png (fast to make, light to show); the canvas is then let go
  function pack(pic){
    if (!workers.length || !packOK || pic.dead || !pic.cv) return;
    // a few at a time, so compressing never crowds out drawing
    if (packs.size >= 3) { packWait.push(pic); return; }
    var id = ++packId;
    packs.set(id, pic);
    createImageBitmap(pic.cv).then(function(bmp){
      if (!workers.length || pic.dead) { packs.delete(id); bmp.close(); return; }
      workers[workers.length - 1].postMessage({ t: 'pack', id: id, bmp: bmp }, [bmp]);
    }, function(){ packs.delete(id); });
  }
  function packed(pic, url){
    var cv = pic.cv;
    pic.url = url; pic.cv = null; canvasCount--; urlCount++;
    trimUrls();
    var s = pic.on ? shown.get(pic.on) : null;
    if (!s || s.el !== cv) { cv.width = 0; cv.height = 0; return; }
    var img = makeImg(url, cv.style.cssText);
    var swap = function(){ if (shown.get(pic.on) === s && s.el === cv && cv.parentNode) { wall.replaceChild(img, cv); s.el = img; } cv.width = 0; cv.height = 0; };
    if (img.decode) img.decode().then(swap, swap); else img.onload = swap;
  }

  // ---------- drawing and placing posters ----------
  function drawItem(it){
    var d = it.kind === 'p' ? (it.d || (it.d = posterData(it.id, it.lvlIdx, it.filler))) : null;
    if (d && !faceReady(d.look, d.faceKey, photoScale(RS))) return null;
    var cv = mk(Math.ceil(it.bw * RS), Math.ceil(it.bh * RS)), g = cv.getContext('2d');
    g.scale(RS, RS); g.translate(14, 12);
    if (d) drawPoster(g, d, RS); else drawScrap(g, it.sd, RS);
    return cv;
  }
  function makeImg(url, css){
    var img = new Image();
    img.alt = ''; img.decoding = 'async'; img.className = 'pst';
    if (css) img.style.cssText = css;
    img.src = url;
    return img;
  }
  // about URL_MAX finished posters are kept (a few tens of MB); older ones that are off screen are redrawn if needed
  var URL_MAX = 500, urlCount = 0;
  function trimUrls(){
    if (urlCount <= URL_MAX) return;
    var on = new Set(); shown.forEach(function(s){ on.add(s.it.key); });
    var it = pics.keys(), n;
    while (urlCount > URL_MAX && !(n = it.next()).done) {
      var p = pics.get(n.value);
      if (p.url && !on.has(n.value)) { URL.revokeObjectURL(p.url); p.dead = true; pics.delete(n.value); urlCount--; }
    }
  }
  function trimCanvases(){
    if (canvasCount <= CANVAS_MAX) return;
    var it = pics.keys(), n;
    while (canvasCount > CANVAS_MAX && !(n = it.next()).done) {
      var p = pics.get(n.value);
      if (p.cv && !p.cv.parentNode) { p.cv.width = 0; p.cv.height = 0; p.dead = true; p.cv = null; pics.delete(n.value); canvasCount--; }
    }
  }
  function place(it, id){
    var pic = pics.get(it.key), el;
    if (pic && pic.url) el = makeImg(pic.url);
    else if (pic && pic.cv && !pic.cv.parentNode) el = pic.cv;
    else if (mode === 'full') { askPoster(it); return false; }
    else {
      var cv = drawItem(it);
      if (!cv) return false;
      if (pic && pic.cv) { canvasCount--; pic.dead = true; }
      pic = { cv: cv }; pics.set(it.key, pic); canvasCount++;
      el = cv; cv.className = 'pst';
      pack(pic);
      trimCanvases();
    }
    if (el === pic.cv) pic.on = id;
    var s = it.s, st = el.style;
    st.width = (it.bw * s).toFixed(1) + 'px'; st.height = (it.bh * s).toFixed(1) + 'px';
    st.transformOrigin = (it.ox * s).toFixed(1) + 'px ' + (it.oy * s).toFixed(1) + 'px';
    st.transform = 'translate(' + (it.x - it.ox * s).toFixed(1) + 'px,' + (it.y - it.oy * s).toFixed(1) + 'px) rotate(' + it.rot.toFixed(4) + 'rad)';
    st.zIndex = String(Math.round((it.z + 1) * 1000));
    wall.appendChild(el);
    shown.set(id, { el: el, it: it });
    return true;
  }
  // put up every poster that reaches into [y0, y1); new drawing stops once the budget (ms since t0) is spent
  function want(y0, y1, t0, budget){
    var list = itemsIn(y0, y1), missing = false;
    for (var j = 0; j < list.length; j++) {
      var it = list[j], id = it.row + ':' + it.key;
      if (shown.has(id)) continue;
      var pic = pics.get(it.key);
      if (mode !== 'full' && !(pic && (pic.url || (pic.cv && !pic.cv.parentNode))) && performance.now() - t0 > budget) { missing = true; continue; }
      if (!place(it, id)) missing = true;
    }
    return missing;
  }
  function cull(y0, y1){
    shown.forEach(function(s, id){
      if (s.it.y >= y0 && s.it.y <= y1) return;
      if (s.el.parentNode) s.el.parentNode.removeChild(s.el);
      shown.delete(id);
    });
    if (rows.size > 400) { var r0 = Math.floor(y0 / rowH) - 4, r1 = Math.floor(y1 / rowH) + 4; rows.forEach(function(v, key){ if (key < r0 || key > r1) rows.delete(key); }); }
  }

  function hitAt(x, wy){
    var list = itemsIn(wy - 1, wy + 1);
    if (hoverIt && list.indexOf(hoverIt) >= 0) { list.splice(list.indexOf(hoverIt), 1); list.push(hoverIt); }
    for (var i = list.length - 1; i >= 0; i--) {
      var it = list[i];
      if (it.kind !== 'p') continue;
      var dx = x - it.x, dy = wy - it.y, c = Math.cos(-it.rot), s = Math.sin(-it.rot);
      var lx = (dx * c - dy * s) / it.s, ly = (dx * s + dy * c) / it.s;
      if (lx >= -130 && lx <= 130 && ly >= -184 && ly <= 184) return it;
    }
    return null;
  }

  // posters stay flat on the wall; only the cursor hints that a click opens one
  function updateHover(){
    hoverRaf = 0;
    var it = (started && mouse) ? hitAt(mouse.x, mouse.y + wallScroll()) : null;
    if (it === hoverIt) return;
    hoverIt = it;
    wall.style.cursor = it ? 'zoom-in' : 'default';
  }
  function scheduleHover(){ if (!hoverRaf) hoverRaf = requestAnimationFrame(updateHover); }

  function frame(){
    rafId = 0;
    var sy = wallScroll();
    if (sy !== lastSY) scrollDir = sy > lastSY ? 1 : -1;
    lastSY = sy;
    if (sy + VH * 5 > wallH) { wallH = sy + VH * 9; wall.style.height = Math.round(wallH) + 'px'; }
    // darkness follows the lap: it deepens towards the end, then lifts just before the wall starts over
    var ph2 = ((sy % PERIOD) + PERIOD) % PERIOD / PERIOD;
    var sm = function(t){ t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
    var op = (0.25 + 0.5 * sm(ph2 / 0.85) * (1 - sm((ph2 - 0.92) / 0.08))).toFixed(2);
    if (op !== duskOp) { duskOp = op; dusk.style.opacity = op; }
    if (!started) return;
    // what is on screen gets up to ~8 ms of new drawing per frame; anything still missing follows next frame
    if (want(sy, sy + VH, performance.now(), 8) && mode !== 'full') schedule();
    cull(sy - VH * 1.5 - EXT, sy + VH * 2.5 + EXT);
    if (mouse) scheduleHover();
    queueIdle();
  }
  function schedule(){ if (!rafId) rafId = requestAnimationFrame(frame); }

  // posters just below (or above, going up) are prepared in spare moments
  var idleQueued = false;
  function queueIdle(){
    if (idleQueued) return;
    idleQueued = true;
    if (window.requestIdleCallback) window.requestIdleCallback(idleWork, { timeout: 200 }); else setTimeout(idleWork, 40);
  }
  function idleWork(deadline){
    idleQueued = false;
    if (!started) return;
    var t0 = performance.now(), sy = wallScroll();
    var budget = deadline && deadline.timeRemaining && !deadline.didTimeout ? Math.max(1, deadline.timeRemaining() - 2) : 8;
    var ahead = scrollDir >= 0 ? [sy + VH, sy + VH * 2.2] : [sy - VH * 1.2, sy];
    var behind = scrollDir >= 0 ? [sy - VH * 0.6, sy] : [sy + VH, sy + VH * 1.6];
    var more = want(ahead[0], ahead[1], t0, budget);
    if (!more) more = want(behind[0], behind[1], t0, budget);
    if (more) queueIdle();
  }

  window.addEventListener('scroll', schedule, { passive: true });
  window.addEventListener('resize', function(){ relayout(false); schedule(); fitLB(); });
  wall.addEventListener('pointermove', function(e){ if (e.pointerType !== 'mouse') return; mouse = { x: e.clientX, y: e.clientY }; scheduleHover(); });
  wall.addEventListener('pointerleave', function(){ mouse = null; scheduleHover(); });

  // ---------- reading one poster ----------
  var lb = document.getElementById('lb');
  var lbCanvas = document.getElementById('lbCanvas');
  var lbText = document.getElementById('lbText');
  var lbData = null;

  function srText(d){
    var parts = [d.header, d.kind === 'streamer' ? d.sur + ', ник закрашен' : d.sur + ' ' + d.nm, d.age, d.story, 'Приметы: ' + d.signs, d.clothesLabel + ' ' + d.clothes, d.contact + (d.phone ? ' Номер закрашен маркером.' : '')];
    if (d.note) parts.push('Приписка от руки: «' + d.note.text + '»' + (d.note.nick ? ', подпись ' + d.note.nick : ''));
    return parts.join('. ');
  }
  function fitLB(){
    if (lb.hidden || !lbData) return;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var fit = Math.min((window.innerWidth - 32) / 288, (window.innerHeight - 96) / 400, 1.8);
    lbCanvas.style.width = Math.round(288 * fit) + 'px';
    lbCanvas.style.height = Math.round(400 * fit) + 'px';
    var sc = fit * dpr;
    lbCanvas.width = Math.ceil(288 * sc); lbCanvas.height = Math.ceil(400 * sc);
    var g = lbCanvas.getContext('2d');
    g.setTransform(sc, 0, 0, sc, 0, 0); g.translate(14, 12);
    drawPoster(g, lbData, sc);
  }
  function openLB(it){
    lbData = posterData(it.id, it.lvlIdx, it.filler);
    if (!lbData.note && lbData.chatNote) lbData.note = lbData.chatNote;
    lbText.textContent = srText(lbData);
    lb.hidden = false;
    fitLB();
    try { lb.focus({ preventScroll: true }); } catch (e) {}
  }
  function closeLB(){
    lb.hidden = true; lbData = null;
    try { wall.focus({ preventScroll: true }); } catch (e) {}
  }
  wall.addEventListener('click', function(e){
    if (!started) return;
    var rc = wall.getBoundingClientRect();
    var it = hitAt(e.clientX - rc.left, e.clientY - rc.top);
    if (it) openLB(it);
  });
  wall.addEventListener('keydown', function(e){
    if (e.key !== 'Enter' || !started) return;
    var it = hitAt(VW / 2, VH / 2 + wallScroll());
    if (it) { e.preventDefault(); e.stopPropagation(); openLB(it); }
  });
  lb.addEventListener('click', closeLB);
  document.addEventListener('keydown', function(e){
    if (lb.hidden) return;
    if (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ') { e.preventDefault(); closeLB(); }
  });

  // ---------- boot: wait briefly for the fonts so every poster is painted once, with the right type ----------
  var SAMPLE = 'ПРОПАЛ ЧЕЛОВЕК Приметы абвгдеёжз 0123';
  var FONT_SPECS = ['700 20px Oswald', '600 20px Oswald', '400 20px "PT Sans Narrow"', '700 20px "PT Sans Narrow"', '600 20px Caveat'];
  function whenFonts(){
    if (!document.fonts || !document.fonts.load) return Promise.resolve();
    return Promise.all(FONT_SPECS.map(function(f){ return document.fonts.load(f, SAMPLE).catch(function(){}); }));
  }
  function boot(data){
    data = data || {};
    if (typeof data.start === 'number') START = ENV.start = data.start;
    try { wall.style.backgroundImage = 'url(' + WALL_TILE.toDataURL('image/png') + ')'; } catch (e) {}
    var y0 = typeof data.y === 'number' ? data.y : 0;
    wallH = Math.max(window.innerHeight * 9, y0 + window.innerHeight * 9);
    wall.style.height = Math.round(wallH) + 'px';
    startWorkers();
    relayout(true);
    if (y0) window.scrollTo(0, y0);
    frame();
    var go = function(){ if (started) return; started = true; schedule(); };
    var timer = setTimeout(go, 1600);
    whenFonts().then(function(){
      shareFonts(FONT_SPECS);
      if (!started) { clearTimeout(timer); go(); }
      else { relayout(true); schedule(); }
    });
  }
  if (hot && hot.snapshot) hot.snapshot(function(){ return { y: window.scrollY || 0, start: START }; });
  if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>

</body>
